<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cheese-Duell">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Cheese-Duell</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151d31;--panel2:#1d2942;--ink:#f7f8fc;--muted:#aab5cc;--line:#34415c;--red:#ff5268;--blue:#4b9cff;--gold:#ffd166;--dot:#f8fafc;--board:#111a2c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#28385c 0%,var(--bg) 58%);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,Segoe UI,sans-serif;padding:env(safe-area-inset-top) 14px calc(18px + env(safe-area-inset-bottom));}
.app{width:min(100%,560px);margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 12px}
.brand{display:flex;align-items:center;gap:11px}.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(145deg,#ffcf70,#ff9c42);display:grid;place-items:center;font-size:25px;box-shadow:0 8px 22px #ff9c4233}
h1{font-size:21px;line-height:1;margin:0;letter-spacing:-.5px}.sub{font-size:12px;color:var(--muted);margin-top:4px}
.pill{font-size:11px;font-weight:750;letter-spacing:.7px;color:#b9c7df;background:#202c45;border:1px solid #34415c;border-radius:99px;padding:8px 11px}
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;gap:9px;margin:10px 0 12px}
.score{background:linear-gradient(145deg,#1a263e,#121a2c);border:1px solid #2c3a56;border-radius:18px;padding:12px 14px;min-width:0;transition:.2s}
.score.active{border-color:var(--player);box-shadow:0 0 0 1px var(--player),0 8px 25px color-mix(in srgb,var(--player) 17%,transparent)}
.score-top{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:700}.dotcolor{width:9px;height:9px;border-radius:50%;background:var(--player)}
.points{font-size:29px;font-weight:850;line-height:1.1;margin-top:5px;font-variant-numeric:tabular-nums}
.vs{align-self:center;color:#72809b;font-size:11px;font-weight:800;letter-spacing:1px}
.turn{display:flex;align-items:center;justify-content:center;gap:9px;background:#151f33;border:1px solid #2b3954;border-radius:14px;padding:11px;margin-bottom:13px;color:#e9eef9;font-size:13px;font-weight:700}
.turn-indicator{width:9px;height:9px;border-radius:50%;background:var(--player);box-shadow:0 0 12px var(--player)}
.board-wrap{background:linear-gradient(145deg,#1b2740,#111a2c);border:1px solid #2a3955;border-radius:23px;padding:12px;box-shadow:0 18px 45px #0005}
.board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(19,minmax(0,1fr));grid-template-rows:repeat(19,minmax(0,1fr));background:var(--board);border-radius:13px;overflow:hidden;touch-action:manipulation}
.dot{width:clamp(5px,1.8vw,9px);height:clamp(5px,1.8vw,9px);border-radius:50%;background:var(--dot);place-self:center;z-index:2;box-shadow:0 0 4px #0005}
.box{display:grid;place-items:center;background:transparent;transition:background .18s}
.box.red{background:color-mix(in srgb,var(--red) 83%,transparent)}
.box.blue{background:color-mix(in srgb,var(--blue) 83%,transparent)}
.edge{appearance:none;border:0;padding:0;margin:0;background:transparent;display:grid;place-items:center;min-width:0;min-height:0;cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent}
.edge:before{content:"";display:block;border-radius:99px;background:transparent;transition:background .12s,box-shadow .12s}
.edge.h:before{width:100%;height:clamp(5px,1.5vw,8px)}
.edge.v:before{height:100%;width:clamp(5px,1.5vw,8px)}
.edge:not(.taken):active:before{background:#8190aa66}
.edge.taken.red:before{background:var(--red);box-shadow:0 0 7px #ff526866}
.edge.taken.blue:before{background:var(--blue);box-shadow:0 0 7px #4b9cff66}
.edge:focus-visible{outline:2px solid var(--gold);outline-offset:-2px;border-radius:5px}
.hint{text-align:center;color:#91a0bb;font-size:11px;margin:10px 2px 2px}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:13px 0}
button.control{border:1px solid #34435f;background:#1b2740;color:#eef3ff;border-radius:13px;padding:12px 8px;font:700 12px inherit;cursor:pointer;min-height:46px}
button.control:active{transform:scale(.98);background:#263653}
button.control.primary{background:#f5b84f;color:#241a0b;border-color:#f5b84f}
.bottom{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.small{background:transparent;border:0;color:#9eacc5;padding:8px;font-size:12px}
.message{display:none;text-align:center;margin:10px 0 2px;padding:12px;border-radius:14px;background:#202d47;border:1px solid #40516e;font-weight:800}
.message.show{display:block}
footer{text-align:center;color:#71809a;font-size:10px;padding:15px 0 4px}
@media(min-width:500px){body{padding-top:22px}.board-wrap{padding:17px}.score{padding:15px 18px}}
</style>
</head>
<body>
<main class="app">
<header>
 <div class="brand"><div class="logo">🧀</div><div><h1>Cheese-Duell</h1><div class="sub">Punkte verbinden. Kästchen erobern.</div></div></div>
 <div class="pill">2 SPIELER</div>
</header>
<section class="scoreboard" aria-label="Spielstand">
 <div class="score active" id="redCard" style="--player:var(--red)"><div class="score-top"><span class="dotcolor"></span> ROT</div><div class="points" id="redScore">0</div></div>
 <div class="vs">VS</div>
 <div class="score" id="blueCard" style="--player:var(--blue)"><div class="score-top"><span class="dotcolor"></span> BLAU</div><div class="points" id="blueScore">0</div></div>
</section>
<div class="turn" id="turn"><span class="turn-indicator" id="turnDot"></span><span id="turnText">Rot ist am Zug</span></div>
<section class="board-wrap">
 <div class="board" id="board" aria-label="Spielfeld mit 10 mal 10 Punkten"></div>
 <div class="hint">Tippe auf einen freien Strich zwischen zwei Punkten.</div>
</section>
<div class="message" id="message" role="status"></div>
<section class="controls">
 <button class="control" id="undo">↶ Rückgängig</button>
 <button class="control" id="theme">☀ Helles Feld</button>
 <button class="control primary" id="restart">＋ Neues Spiel</button>
</section>
<div class="bottom"><button class="small" id="rules">Wie wird gespielt?</button></div>
<footer>Ein Strich pro Zug · Immer abwechselnd · Viel Spaß!</footer>
</main>
<script>
const $=id=>document.getElementById(id), N=10;
let current='red', edges={}, owners={}, history=[], light=false, finished=false;
const edgeId=(t,r,c)=>`${t}-${r}-${c}`, boxId=(r,c)=>`${r}-${c}`;
function makeBoard(){
 const b=$('board'); b.innerHTML=''; edges={}; owners={}; history=[]; current='red'; finished=false;
 for(let r=0;r<19;r++) for(let c=0;c<19;c++){
  const el=document.createElement((r%2!==0&&c%2!==0)?'div':(r%2===0&&c%2===0)?'div':'button');
  if(r%2===0&&c%2===0){el.className='dot';}
  else if(r%2!==0&&c%2!==0){el.className='box';owners[boxId((r-1)/2,(c-1)/2)]={el,owner:null};}
  else{
   const horizontal=r%2===0, rr=horizontal?r/2:(r-1)/2, cc=horizontal?(c-1)/2:c/2;
   const id=edgeId(horizontal?'h':'v',rr,cc); el.className='edge '+(horizontal?'h':'v'); el.type='button';el.setAttribute('aria-label','Linie setzen');el.addEventListener('click',()=>play(id));edges[id]=el;
  }
  b.appendChild(el);
 }
 update();
}
function boxEdges(r,c){return [edgeId('h',r,c),edgeId('h',r+1,c),edgeId('v',r,c),edgeId('v',r,c+1)]}
function snapshot(){return {current,edgeState:Object.fromEntries(Object.entries(edges).map(([k,e])=>[k,e.className])),boxState:Object.fromEntries(Object.entries(owners).map(([k,v])=>[k,v.owner]))};}
function play(id){
 if(finished||edges[id].classList.contains('taken'))return;
 history.push(snapshot());
 const el=edges[id];el.classList.add('taken',current);
 const [type,rs,cs]=id.split('-'),r=+rs,c=+cs;
 const nearby=type==='h'?[[r-1,c],[r,c]]:[[r,c-1],[r,c]];
 nearby.forEach(([br,bc])=>{
  if(br<0||br>=9||bc<0||bc>=9)return;
  const owner=owners[boxId(br,bc)];
  if(!owner.owner&&boxEdges(br,bc).every(k=>edges[k].classList.contains('taken'))){
   owner.owner=current;owner.el.classList.add(current);
  }
 });
 current=current==='red'?'blue':'red';
 if(Object.values(owners).every(x=>x.owner))finished=true;
 update();
}
function restore(s){
 current=s.current;finished=false;
 Object.entries(s.edgeState).forEach(([k,v])=>edges[k].className=v);
 Object.entries(s.boxState).forEach(([k,v])=>{owners[k].owner=v;owners[k].el.className='box'+(v?' '+v:'')});
 update();
}
function update(){
 const red=Object.values(owners).filter(x=>x.owner==='red').length,blue=Object.values(owners).filter(x=>x.owner==='blue').length;
 $('redScore').textContent=red;$('blueScore').textContent=blue;
 $('redCard').classList.toggle('active',current==='red'&&!finished);$('blueCard').classList.toggle('active',current==='blue'&&!finished);
 $('turnDot').style.background=current==='red'?'var(--red)':'var(--blue)';
 $('turnDot').style.boxShadow=`0 0 12px ${current==='red'?'var(--red)':'var(--blue)'}`;
 $('turnText').textContent=finished?'Spiel beendet':(current==='red'?'Rot ist am Zug':'Blau ist am Zug');
 $('undo').disabled=history.length===0;$('undo').style.opacity=history.length?1:.45;
 const msg=$('message');
 if(finished){msg.classList.add('show');msg.textContent=red===blue?`🤝 Unentschieden! ${red} : ${blue}`:red>blue?`🏆 Rot gewinnt mit ${red} : ${blue} Kästchen!`:`🏆 Blau gewinnt mit ${blue} : ${red} Kästchen!`;}
 else{msg.classList.remove('show');msg.textContent='';}
}
$('undo').addEventListener('click',()=>{if(history.length)restore(history.pop())});
$('restart').addEventListener('click',()=>{if(confirm('Neues Spiel starten? Der aktuelle Spielstand geht verloren.'))makeBoard()});
$('theme').addEventListener('click',()=>{light=!light;document.documentElement.style.setProperty('--board',light?'#f5f7fb':'#111a2c');document.documentElement.style.setProperty('--dot',light?'#151d31':'#f8fafc');$('theme').textContent=light?'☾ Dunkles Feld':'☀ Helles Feld'});
$('rules').addEventListener('click',()=>alert('Ihr spielt abwechselnd: Rot, dann Blau. Tippe pro Zug genau einen freien Strich. Wer ein Kästchen mit seinem Strich schließt, bekommt es in seiner Farbe. Danach ist trotzdem der andere Spieler dran. Wer am Ende die meisten Kästchen hat, gewinnt!'));
makeBoard();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
</script>
</body>
</html>
