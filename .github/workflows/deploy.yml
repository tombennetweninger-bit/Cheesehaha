
name: Deploy Cheese-Duell

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Dateien herunterladen
        uses: actions/checkout@v4

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Cheese-Duell hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: App veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
